[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wbs-sam2-inference"
version = "0.1.0"
description = "Lightweight, configuration-driven SAM2 region-growing inference for white-blood-cell segmentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Jun Xu" }]
dependencies = [
  "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86",
  "Pillow==11.3.0",
  "scikit-image==0.25.2",
  "scikit-learn==1.7.2",
  "scipy==1.16.2",
  "torch==2.8.0",
  "torchvision==0.23.0",
]

[project.optional-dependencies]
sam2 = [
  "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]
test = ["pytest==8.4.2", "ruff==0.16.2"]

[project.scripts]
wbs-infer = "wbs_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
